apiVersion: apps/v1
kind: Deployment
metadata:
  name: remindmeai-worker
  namespace: remindmeai
  labels:
    app: remindmeai-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: remindmeai-worker
  template:
    metadata:
      labels:
        app: remindmeai-worker
    spec:
      serviceAccountName: remindmeai-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: remindmeai/backend:4.0.0
          command:
            - celery
            - -A
            - app.core.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - --queues=celery,nlp
          envFrom:
            - configMapRef:
                name: remindmeai-config
            - secretRef:
                name: remindmeai-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.core.celery_app
                - inspect
                - ping
                - -d
                - celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remindmeai-beat
  namespace: remindmeai
  labels:
    app: remindmeai-beat
spec:
  replicas: 1  # Beat must always run as a single instance
  selector:
    matchLabels:
      app: remindmeai-beat
  template:
    metadata:
      labels:
        app: remindmeai-beat
    spec:
      serviceAccountName: remindmeai-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: beat
          image: remindmeai/backend:4.0.0
          command:
            - celery
            - -A
            - app.core.celery_app
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: remindmeai-config
            - secretRef:
                name: remindmeai-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
