apiVersion: v1
kind: Service
metadata:
  name: remindmeai-api-service
  namespace: remindmeai
  labels:
    app: remindmeai-api
spec:
  selector:
    app: remindmeai-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: remindmeai-frontend-service
  namespace: remindmeai
  labels:
    app: remindmeai-frontend
spec:
  selector:
    app: remindmeai-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
