# ============================================================
# IMPORTANT: Do NOT commit real secrets here.
# Use kubectl create secret or a Vault-injected secret.
# This file shows the structure only — values are placeholders.
#
# In production, use External Secrets Operator or Vault Agent
# to populate these from HashiCorp Vault.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: remindmeai-secrets
  namespace: remindmeai
  annotations:
    # Vault Agent injection (when using Vault Injector)
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "remindmeai"
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_REAL_SECRET_KEY"
  FERNET_KEY: "REPLACE_WITH_REAL_FERNET_KEY"
  DATABASE_URL: "postgresql+asyncpg://remindme:REPLACE@postgres-service:5432/remindmeai"
  GMAIL_CLIENT_ID: "REPLACE"
  GMAIL_CLIENT_SECRET: "REPLACE"
  OUTLOOK_CLIENT_ID: "REPLACE"
  OUTLOOK_CLIENT_SECRET: "REPLACE"
  AWS_ACCESS_KEY_ID: "REPLACE"
  AWS_SECRET_ACCESS_KEY: "REPLACE"
  SES_SENDER_EMAIL: "noreply@remindmeai.com"
  FCM_SERVICE_ACCOUNT_JSON: "REPLACE"
  VAULT_TOKEN: "REPLACE"
